name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or an explicit version like 1.2.0"
        required: true
        default: patch
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump version and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<<"$current"

          case "$INPUT" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
            [0-9]*.[0-9]*.[0-9]*) new="$INPUT" ;;
            *) echo "invalid version input: $INPUT" >&2; exit 1 ;;
          esac
          [ "$new" != "$current" ] || { echo "version $new is not newer" >&2; exit 1; }

          # bump the package version in Cargo.toml, then mirror it into Cargo.lock
          awk -v new="$new" '!d && /^version = "/ { sub(/"[^"]*"/, "\"" new "\""); d = 1 } { print }' Cargo.toml >Cargo.toml.tmp
          awk -v new="$new" '/^name = "diffy"$/ { f = 1 } f && /^version = / { sub(/"[^"]*"/, "\"" new "\""); f = 0 } { print }' Cargo.lock >Cargo.lock.tmp
          mv Cargo.toml.tmp Cargo.toml && mv Cargo.lock.tmp Cargo.lock

          [ "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" = "$new" ]
          [ "$(grep -A1 '^name = "diffy"$' Cargo.lock | sed -n 2p)" = "version = \"$new\"" ]

          branch="release/v$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -C / -f so a rerun after a failed PR creation reuses the same branch
          git switch -C "$branch"
          git commit -am "Release v$new"
          git push -f origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json url -q '.[0].url')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Release v$new" \
              --body "Bumps the crate version to v$new. Merging this runs the release build."
          fi

  release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Build arm64 macOS binary
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >>"$GITHUB_ENV"

          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/diffy | grep -q arm64

          mkdir -p dist
          asset="diffy-v$version-aarch64-apple-darwin.tar.gz"
          tar -czf "dist/$asset" -C target/aarch64-apple-darwin/release diffy
          (cd dist && shasum -a 256 "$asset" >"$asset.sha256")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi

          gh release create "v$VERSION" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v$VERSION" \
            --generate-notes
